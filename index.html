<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 大模型面试刷题 · ZZH</title>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --ink: #1f2933;
    --ink-soft: #5b6675;
    --line: #e3e8ef;
    --brand: #2563eb;
    --brand-soft: #e8f0fe;
    --gold: #f5a623;
    --green: #16a34a;
    --green-soft: #e7f6ec;
    --red: #dc2626;
    --red-soft: #fdeaea;
    --shadow: 0 2px 10px rgba(20, 30, 50, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 18px 16px 60px; }

  /* 顶栏 */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; }
  header h1 .sub { font-size: 12px; color: var(--ink-soft); font-weight: 400; margin-left: 6px; }
  .stats { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 10px; }
  .stats b { color: var(--brand); }

  /* 进度条 */
  .progress { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
  .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2563eb, #4f9bff); transition: width .25s; }

  /* 工具栏 */
  .toolbar {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; box-shadow: var(--shadow); margin-bottom: 16px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .toolbar .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--ink-soft); }
  select, input[type="search"] {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 14px; background: #fff; color: var(--ink); outline: none; width: 100%;
  }
  select:focus, input:focus { border-color: var(--brand); }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font-family: inherit; cursor: pointer; border: 1px solid var(--line);
    background: #fff; color: var(--ink); border-radius: 8px; padding: 8px 14px;
    font-size: 14px; transition: .15s;
  }
  button:hover { border-color: var(--brand); color: var(--brand); }
  button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  button.primary:hover { background: #1d4fd0; color: #fff; }
  button.ghost { background: transparent; }
  button:active { transform: translateY(1px); }

  /* 卡片 */
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px; box-shadow: var(--shadow); min-height: 200px;
  }
  .card .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .badge {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand); font-weight: 600;
  }
  .qno { font-size: 12px; color: var(--ink-soft); }
  .stars { color: var(--gold); font-size: 14px; letter-spacing: 1px; }
  .qtext { font-size: 20px; font-weight: 700; margin: 4px 0 16px; line-height: 1.5; }

  .reveal-hint { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 18px 0; }

  .answer { display: none; }
  .answer.show { display: block; animation: fade .2s ease; }
  @keyframes fade { from { opacity: .2; } to { opacity: 1; } }

  .ans-block { margin-bottom: 16px; }
  .ans-head {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700;
    color: var(--brand); margin-bottom: 6px;
  }
  .ans-head .tag {
    background: var(--brand-soft); color: var(--brand); border-radius: 6px;
    padding: 1px 8px; font-size: 12px;
  }
  .flow {
    background: #fbfcfe; border: 1px dashed #c7d6f0; border-left: 4px solid var(--brand);
    border-radius: 8px; padding: 12px 14px; font-size: 14px; color: #243b66;
    line-height: 1.9; word-break: break-word;
  }
  .flow b { color: var(--brand); }
  .para {
    background: #fcfdfc; border: 1px solid var(--line); border-left: 4px solid var(--green);
    border-radius: 8px; padding: 12px 14px; font-size: 15px; color: #243a2c;
  }

  /* 底部导航 */
  .nav {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 16px; flex-wrap: wrap;
  }
  .nav .mid { font-size: 13px; color: var(--ink-soft); }
  .nav .mid b { color: var(--ink); }
  .mark-btns { display: flex; gap: 8px; }

  .marked { color: var(--green) !important; border-color: var(--green) !important; background: var(--green-soft) !important; }

  .empty { text-align: center; color: var(--ink-soft); padding: 40px 0; }

  .tips { font-size: 12px; color: var(--ink-soft); margin-top: 14px; text-align: center; }
  kbd {
    background: #fff; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; font-size: 11px; font-family: inherit;
  }

  /* 主题切换按钮 */
  .theme-toggle { padding: 4px 9px; font-size: 13px; }
  /* 深色模式 */
  body.dark {
    --bg: #0f1419; --panel: #1a212b; --ink: #e6edf3; --ink-soft: #9aa7b4;
    --line: #2a323d; --brand: #4f9bff; --brand-soft: #16263d;
    --green: #3fb950; --green-soft: #11271a; --red: #f85149;
    --red-soft: #2d1616; --shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  body.dark .flow { background: #11161d; border-color: #2f3b4d; color: #bcd0e8; }
  body.dark .para { background: #121a14; border-color: #2a3a2c; color: #bfe6c8; }
  body.dark kbd { background: #11161d; }
  /* 深色模式：表单控件与按钮改用深色底，避免白底白字看不清 */
  body.dark select,
  body.dark input[type="search"] { background: #0f1419; color: var(--ink); border-color: var(--line); }
  body.dark button { background: #1a212b; }
  body.dark button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  /* 间隔重复评分按钮 */
  .rate-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button.again { border-color: var(--red); color: var(--red); }
  button.again:hover { background: var(--red); color: #fff; }
  button.hard { border-color: #d29922; color: #d29922; }
  button.hard:hover { background: #d29922; color: #fff; }
  button.good { border-color: var(--green); color: var(--green); }
  button.good:hover { background: var(--green); color: #fff; }
  button.easy { border-color: var(--brand); color: var(--brand); }
  button.easy:hover { background: var(--brand); color: #fff; }
  .due-badge { font-size: 12px; color: var(--ink-soft); }
  .due-badge.over { color: var(--red); font-weight: 600; }
  .due-badge.settable { cursor: pointer; border-bottom: 1px dotted var(--ink-soft); }
  .due-badge.settable:hover { color: var(--brand); }
  /* 春招倒计时复习计划条 */
  .plan-bar {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; box-shadow: var(--shadow); margin-bottom: 14px;
    font-size: 14px; color: var(--ink); display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .plan-bar b { color: var(--brand); }
  .plan-bar .cat { color: var(--ink-soft); font-size: 13px; }
  .plan-bar .set { cursor: pointer; border-bottom: 1px dotted var(--ink-soft); margin-left: 4px; }
  .plan-bar .set:hover { color: var(--brand); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧠 AI 大模型面试刷题 <span class="sub">ZZH · 2027 春招</span></h1>
    <div class="stats">
      <button id="btnTheme" class="theme-toggle">🌙 深色</button>
      已掌握 <b id="statMastered">0</b> / <span id="statTotal">0</span>
      <span id="statPct">(0%)</span>
      <span id="statDue" class="due-badge">· 待复习 0</span>
      <span id="statCountdown" class="due-badge settable" title="点击设置春招目标日">📅 距春招 — 天</span>
    </div>
  </header>

  <div class="progress"><i id="progressBar"></i></div>

  <div class="toolbar">
    <div class="field">
      <label>分类</label>
      <select id="fCat"></select>
    </div>
    <div class="field">
      <label>星级（高频程度）</label>
      <select id="fStar">
        <option value="0">全部</option>
        <option value="5">⭐⭐⭐⭐⭐ 必背</option>
        <option value="4">⭐⭐⭐⭐ 及以上</option>
        <option value="3">⭐⭐⭐ 及以上</option>
      </select>
    </div>
    <div class="field full">
      <label>搜索题目 / 关键词</label>
      <input type="search" id="fSearch" placeholder="如：RAG、Agent、LoRA、Transformer、薪资…" />
    </div>
    <div class="field">
      <label>模式</label>
      <select id="fMode">
        <option value="all">顺序刷题</option>
        <option value="due">只看待复习</option>
        <option value="new">未学习</option>
        <option value="grad">已掌握</option>
      </select>
    </div>
    <div class="field">
      <label>操作</label>
      <div class="row-btns">
        <button id="btnShuffle">🔀 随机一题</button>
        <button id="btnReset" class="ghost">↺ 重置进度</button>
      </div>
    </div>
  </div>

  <div class="plan-bar" id="planBar">📋 今日计划：计算中…</div>

  <div class="card" id="card">
    <!-- JS 渲染 -->
  </div>

  <div class="nav">
    <button id="btnPrev">← 上一题</button>
    <div class="mid">第 <b id="curIdx">0</b> / <span id="curTotal">0</span> 题</div>
      <div class="mark-btns rate-btns">
        <button id="btnAgain" class="again">🔴 忘记</button>
        <button id="btnHard" class="hard">🟠 困难</button>
        <button id="btnGood" class="good">🟢 良好</button>
        <button id="btnEasy" class="easy">🔵 简单</button>
      </div>
    <button id="btnNext">下一题 →</button>
  </div>

  <div class="tips">
    快捷键：<kbd>空格</kbd> 显示/隐藏答案 · <kbd>←</kbd> / <kbd>→</kbd> 切换题目 · <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd>/<kbd>4</kbd> 评分(忘/难/良/易) ·
    进度自动保存在本机浏览器。点「距春招 N 天」可改目标日，点计划条可改每日新学额度。
  </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var STORE_KEY = "interview_quiz_progress_v1";
  var card = document.getElementById("card");
  var fCat = document.getElementById("fCat");
  var fStar = document.getElementById("fStar");
  var fSearch = document.getElementById("fSearch");
  var fMode = document.getElementById("fMode");

  // 读取进度（SM-2 间隔重复模型）
  function loadProgress() {
    var p;
    try { p = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { p = null; }
    if (!p || typeof p !== "object") p = {};
    // 兼容旧版 { mastered:{} }：把已掌握标记为"已毕业"状态，避免丢失历史进度
    if (p.mastered && typeof p.mastered === "object") {
      p.cards = p.cards || {};
      var now0 = Date.now();
      Object.keys(p.mastered).forEach(function (k) {
        if (p.mastered[k] && !p.cards[k]) {
          p.cards[k] = { reps: 2, interval: 6, ease: 2.5, due: now0 + 6 * 86400000, last: now0 };
        }
      });
      delete p.mastered;
    }
    p.cards = p.cards || {};
    p.reviewLog = p.reviewLog || 0;
    p.streak = p.streak || 0;
    p.lastDay = p.lastDay || "";
    return p;
  }
  function saveProgress(p) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) {}
  }
  var progress = loadProgress();

  function endOfToday() {
    var d = new Date();
    d.setHours(23, 59, 59, 999);
    return d.getTime();
  }
  function isGraduated(c) { return c && c.reps >= 2; }
  function isDue(c) { return c && c.due <= endOfToday(); }

  // SM-2 算法：q 取 0~5（忘记=2 / 困难=3 / 良好=4 / 简单=5）
  function sm2(c, q) {
    var ease = c && c.ease ? c.ease : 2.5;
    var reps = c && c.reps ? c.reps : 0;
    var interval = c && c.interval ? c.interval : 0;
    if (q < 3) {
      reps = 0;
      interval = 1; // 忘了：明天重学
    } else {
      if (reps === 0) interval = 1;
      else if (reps === 1) interval = 6;
      else interval = Math.round(interval * ease);
      reps += 1;
    }
    ease = ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
    if (ease < 1.3) ease = 1.3;
    var now = Date.now();
    return {
      reps: reps,
      interval: interval,
      ease: Math.round(ease * 100) / 100,
      due: now + interval * 86400000,
      last: now
    };
  }

  // 初始化分类下拉
  (function initCats() {
    var cats = [];
    CATEGORY_ORDER.forEach(function (c) {
      if (QUIZ_DATA.some(function (q) { return q.cat === c; })) cats.push(c);
    });
    var html = '<option value="all">全部分类</option>';
    cats.forEach(function (c) { html += '<option value="' + c + '">' + c + "</option>"; });
    fCat.innerHTML = html;
  })();

  function starStr(n) { return "⭐".repeat(n); }
  function dueText(c) {
    var days = Math.ceil((c.due - Date.now()) / 86400000);
    if (days <= 0) return "今天";
    if (days === 1) return "明天";
    return days + " 天后";
  }

  // ===== 春招倒计时复习计划 =====
  var COUNTDOWN_KEY = "interview_quiz_target";
  var DAILY_NEW_KEY = "interview_quiz_dailynew";
  function getTarget() {
    var t = null;
    try { t = localStorage.getItem(COUNTDOWN_KEY); } catch (e) {}
    return t || "2027-03-15";
  }
  function getDailyNew() {
    var n = 5;
    try { var v = localStorage.getItem(DAILY_NEW_KEY); if (v) n = parseInt(v, 10) || 5; } catch (e) {}
    return n;
  }
  function daysUntil(dateStr) {
    var p = dateStr.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]); d.setHours(0, 0, 0, 0);
    var now = new Date(); now.setHours(0, 0, 0, 0);
    return Math.round((d - now) / 86400000);
  }
  function catShort(name) { return name.replace(/^[^、]*、/, "") || name; }
  function updateCountdown() {
    var el = document.getElementById("statCountdown");
    if (!el) return;
    var n = daysUntil(getTarget());
    el.textContent = n >= 0 ? ("📅 距春招 " + n + " 天") : ("📅 春招已过 " + (-n) + " 天");
  }
  function updatePlan() {
    var bar = document.getElementById("planBar");
    if (!bar) return;
    var byCat = {}, dueTotal = 0;
    QUIZ_DATA.forEach(function (q) {
      var c = progress.cards[q.id];
      if (isDue(c)) { dueTotal++; byCat[q.cat] = (byCat[q.cat] || 0) + 1; }
    });
    var newN = getDailyNew();
    var cats = Object.keys(byCat).map(function (k) { return '<span class="cat">' + catShort(k) + " " + byCat[k] + "</span>"; });
    var review = dueTotal > 0
      ? ("复习 <b>" + dueTotal + "</b> 道（" + cats.join(" · ") + "）")
      : "今日无待复习 🎉";
    bar.innerHTML = "📋 今日计划：" + review + " · 新学 <b>" + newN + "</b> 道" +
      ' <span class="set" id="planSet">(改额度)</span>';
    var ps = document.getElementById("planSet");
    if (ps) ps.addEventListener("click", setDailyNew);
  }
  function setDailyNew() {
    var inp = prompt("设置每天新学题数（默认 5）：", String(getDailyNew()));
    if (!inp) return;
    var n = parseInt(inp, 10);
    if (!(n >= 0)) { alert("请输入非负整数"); return; }
    try { localStorage.setItem(DAILY_NEW_KEY, String(n)); } catch (e) {}
    updatePlan();
  }
  function setTarget() {
    var inp = prompt("设置春招目标日期（格式 YYYY-MM-DD）：", getTarget());
    if (!inp) return;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(inp)) { alert("格式不对，请用 YYYY-MM-DD"); return; }
    try { localStorage.setItem(COUNTDOWN_KEY, inp); } catch (e) {}
    updateCountdown();
  }

  // 构建筛选后的列表
  function buildList() {
    var cat = fCat.value, star = +fStar.value, kw = fSearch.value.trim().toLowerCase(), mode = fMode.value;
    return QUIZ_DATA.filter(function (q) {
      if (cat !== "all" && q.cat !== cat) return false;
      if (star && q.stars < star) return false;
      var c = progress.cards[q.id];
      if (mode === "due" && !isDue(c)) return false;
      if (mode === "new" && c) return false;
      if (mode === "grad" && !isGraduated(c)) return false;
      if (kw) {
        var hay = (q.q + " " + q.flow + " " + q.ans + " " + q.cat).toLowerCase();
        if (hay.indexOf(kw) === -1) return false;
      }
      return true;
    });
  }

  var list = [];
  var idx = 0;

  function refreshStats() {
    var total = QUIZ_DATA.length;
    var grad = 0, due = 0;
    QUIZ_DATA.forEach(function (q) {
      var c = progress.cards[q.id];
      if (isGraduated(c)) grad++;
      if (isDue(c)) due++;
    });
    document.getElementById("statMastered").textContent = grad;
    document.getElementById("statTotal").textContent = total;
    document.getElementById("statPct").textContent = "(" + Math.round(grad / total * 100) + "%)";
    document.getElementById("progressBar").style.width = (grad / total * 100) + "%";
    var dueEl = document.getElementById("statDue");
    dueEl.textContent = "· 待复习 " + due;
    dueEl.className = due > 0 ? "due-badge over" : "due-badge";
    updateCountdown();
    updatePlan();
  }

  function render() {
    if (!list.length) {
      card.innerHTML = '<div class="empty">没有符合条件的题目，调整筛选条件试试～</div>';
      document.getElementById("curIdx").textContent = "0";
      document.getElementById("curTotal").textContent = "0";
      return;
    }
    if (idx >= list.length) idx = list.length - 1;
    if (idx < 0) idx = 0;
    var q = list[idx];
    var c = progress.cards[q.id];
    var isM = isGraduated(c);

    var flowHtml = q.flow
      .split("-->")
      .map(function (s) { return "<b>" + s.trim() + "</b>"; })
      .join(" → ");

    card.innerHTML =
      '<div class="meta">' +
        '<span class="badge">' + q.cat + "</span>" +
        '<span class="qno">#' + q.id + "</span>" +
        '<span class="stars">' + starStr(q.stars) + "</span>" +
        (c ? '<span class="due-badge' + (isDue(c) ? " over" : "") + '">· 下次 ' + dueText(c) + "</span>" : "") +
      "</div>" +
      '<div class="qtext">' + q.q + "</div>" +
      '<div class="reveal-hint" id="hint">点击「显示答案」开始背诵 👇</div>' +
      '<div class="answer" id="ans">' +
        '<div class="ans-block">' +
          '<div class="ans-head"><span class="tag">流程描述</span> 记骨架（按步骤背）</div>' +
          '<div class="flow">' + flowHtml + "</div>" +
        "</div>" +
        '<div class="ans-block">' +
          '<div class="ans-head"><span class="tag">背诵文段</span> 一段话口述</div>' +
          '<div class="para">' + q.ans + "</div>" +
        "</div>" +
      "</div>";

    document.getElementById("curIdx").textContent = idx + 1;
    document.getElementById("curTotal").textContent = list.length;

    // 评分按钮（忘记/困难/良好/简单）不再需要按状态高亮
  }

  function showAnswer() {
    var ans = document.getElementById("ans");
    var hint = document.getElementById("hint");
    if (!ans) return;
    if (ans.classList.contains("show")) {
      ans.classList.remove("show");
      if (hint) hint.style.display = "block";
    } else {
      ans.classList.add("show");
      if (hint) hint.style.display = "none";
    }
  }

  function rate(grade) {
    if (!list.length) return;
    var id = list[idx].id;
    progress.cards[id] = sm2(progress.cards[id], grade);
    progress.reviewLog = (progress.reviewLog || 0) + 1;
    // streak：按自然日累计
    var today = (function () {
      var d = new Date();
      return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    })();
    if (progress.lastDay !== today) {
      var y = new Date(Date.now() - 86400000);
      var yStr = y.getFullYear() + "-" + (y.getMonth() + 1) + "-" + y.getDate();
      progress.streak = (progress.lastDay === yStr) ? (progress.streak + 1) : 1;
      progress.lastDay = today;
    }
    saveProgress(progress);
    refreshStats();
    render();
    savePos();
  }

  function go(delta) {
    if (!list.length) return;
    idx += delta;
    if (idx < 0) idx = 0;
    if (idx >= list.length) idx = list.length - 1;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    savePos();
  }

  function rebuild() {
    list = buildList();
    idx = 0;
    if (progress.lastId != null) {
      for (var k = 0; k < list.length; k++) {
        if (list[k].id === progress.lastId) { idx = k; break; }
      }
    }
    render();
    savePos();
  }

  // 续学：记住上次所在题与筛选状态，下次打开自动回到该题
  function savePos() {
    try {
      if (list.length) progress.lastId = list[idx].id;
      saveProgress(progress);
      var ui = { cat: fCat.value, star: fStar.value, mode: fMode.value, kw: fSearch.value };
      localStorage.setItem("interview_quiz_ui", JSON.stringify(ui));
    } catch (e) {}
  }
  function restoreUI() {
    try {
      var ui = JSON.parse(localStorage.getItem("interview_quiz_ui"));
      if (ui && typeof ui === "object") {
        if (ui.cat) fCat.value = ui.cat;
        if (ui.star) fStar.value = ui.star;
        if (ui.mode) fMode.value = ui.mode;
        if (ui.kw != null) fSearch.value = ui.kw;
      }
    } catch (e) {}
  }

  // 事件
  fCat.addEventListener("change", rebuild);
  fStar.addEventListener("change", rebuild);
  fMode.addEventListener("change", rebuild);
  fSearch.addEventListener("input", rebuild);
  document.getElementById("btnPrev").addEventListener("click", function () { go(-1); });
  document.getElementById("btnNext").addEventListener("click", function () { go(1); });
  document.getElementById("btnAgain").addEventListener("click", function () { rate(2); });
  document.getElementById("btnHard").addEventListener("click", function () { rate(3); });
  document.getElementById("btnGood").addEventListener("click", function () { rate(4); });
  document.getElementById("btnEasy").addEventListener("click", function () { rate(5); });
  document.getElementById("btnShuffle").addEventListener("click", function () {
    if (!list.length) return;
    var r; do { r = Math.floor(Math.random() * list.length); } while (list.length > 1 && r === idx);
    idx = r; render(); window.scrollTo({ top: 0, behavior: "smooth" });
    savePos();
  });
  document.getElementById("btnReset").addEventListener("click", function () {
    if (confirm("确定清空所有复习进度（已掌握/待复习/连胜）？")) {
      progress = { cards: {}, reviewLog: 0, streak: 0, lastDay: "" };
      saveProgress(progress); refreshStats(); render();
    }
  });

  // 评分入口由四个按钮与快捷键 1/2/3/4 共用（见 rate 函数）

  // 点击卡片上的提示/答案区也可切换显示
  card.addEventListener("click", function (e) {
    if (e.target && e.target.id === "hint") showAnswer();
  });

  // 键盘
  document.addEventListener("keydown", function (e) {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
    if (e.code === "Space") { e.preventDefault(); showAnswer(); }
    else if (e.code === "ArrowRight") { go(1); }
    else if (e.code === "ArrowLeft") { go(-1); }
    else if (e.key === "1") { rate(2); }
    else if (e.key === "2") { rate(3); }
    else if (e.key === "3") { rate(4); }
    else if (e.key === "4") { rate(5); }
  });

  // 主题（深色模式）
  var THEME_KEY = "interview_quiz_theme";
  function applyTheme(t) {
    document.body.classList.toggle("dark", t === "dark");
    var tb = document.getElementById("btnTheme");
    if (tb) tb.textContent = t === "dark" ? "☀️ 浅色" : "🌙 深色";
  }
  var savedTheme = "light";
  try { savedTheme = localStorage.getItem(THEME_KEY) || "light"; } catch (e) {}
  applyTheme(savedTheme);
  document.getElementById("btnTheme").addEventListener("click", function () {
    savedTheme = savedTheme === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, savedTheme); } catch (e) {}
    applyTheme(savedTheme);
  });
  document.getElementById("statCountdown").addEventListener("click", setTarget);

  // 启动（先恢复上次筛选/位置，再续学）
  restoreUI();
  refreshStats();
  rebuild();
})();
</script>
</body>
</html>
